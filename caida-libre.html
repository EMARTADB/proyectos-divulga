<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Caída Libre y Conservación de la Energía - Galileo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }

    }

      color: #94a3b8;
      max-width: 600px;

      border-radius: 1rem;

  <div class="video-container">
    <video autoplay loop muted playsinline controls>
